[project]
name = "thermal-printer"
version = "0.1.0"
description = "Agent-friendly driver, web UI, and OpenCode plugin for tiny BLE thermal printers"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "bleak>=0.22.3",
  "fastapi>=0.115.0",
  "pillow>=10.4.0",
  "pyserial>=3.5",
  "python-multipart>=0.0.12",
  "qrcode[pil]>=7.4.2",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.2",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]

[project.scripts]
thermal = "thermal.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thermal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
